<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Alpha AI — Rafin</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

<main class="alphaChatPage">

  <header class="alphaHeader">
    <a class="alphaBrand" href="index.html">Rafin</a>

    <div class="alphaTitle">
      <span class="alphaLogo" aria-hidden="true">
        <span class="alphaLogoCore"></span>
        <span class="alphaLogoArc"></span>
        <span class="alphaLogoArcTwo"></span>
      </span>

      <span>Alpha AI</span>
    </div>

    <div class="alphaHeaderSpacer"></div>
  </header>

  <section class="alphaConversation">
    <div id="chatMessages" class="chatMessages"></div>
  </section>

  <div class="alphaComposerArea">

    <form id="chatForm" class="chatComposer">

      <textarea
        id="chatInput"
        rows="1"
        placeholder="Message Alpha AI..."
        aria-label="Message Alpha AI"
      ></textarea>

      <button
        type="submit"
        aria-label="Send message"
        class="sendButton"
      >↑</button>

    </form>

    <p
      id="chatStatus"
      class="chatStatus"
      aria-live="polite"
    ></p>

  </div>

</main>

<script src="script.js"></script>
<script>
  initChat();
</script>

</body>
</html>
